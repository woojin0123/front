<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        @import url(https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css);

        * {
            box-sizing: border-box;
        }

        
html {
    scroll-behavior: smooth;
}

        html,
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #151531 0%, #000 100%);
            margin: 0;
            padding: 0;
        }

        body {
            color: #FFF;
            -webkit-text-stroke-width: 0.89px;
            -webkit-text-stroke-color: rgba(255, 241, 169, 0.15);
            font-family: "Bookk Myungjo";
            font-size: 0.9rem;
            font-style: normal;
            font-weight: 400;
            line-height: normal;
        }

        p,
        img,
        h1,
        h2,
        h3,
        ul,
        li,
        i {
            margin: 0;
            padding: 0;
        }

        ul,
        li {
            list-style: none;
        }

        main {
            overflow: hidden;
        }

        input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: "Bookk Myungjo";
        }

        main {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: flex;
            justify-content: space-between;
            max-width: 500px;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
            margin: 0 auto;
        }

        .logo a {
            position: absolute;
            top: 30px;
            right: 4%;
            left: auto;
            color: #ffffff;
            text-decoration: none;
        }


        .logo>img {
            max-width: 60%;
            height: auto;
            padding-top: 60px;
        }

        .layout {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 20px;
            margin-top: 30px;
        }

        .box1 {
            width: 100%;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 50px;
        }

        .box {
            display: block;
            margin: 0px auto;
            margin-top: 20px;
            width: 100%;
            max-width: 100%;
            height: 4vh;
            min-height: 80px;
            border-radius: 16px;
            border: 0.5px solid #fffbe4c4;
            box-shadow: 0px 0px 5px #F7E06D;
            background: transparent;
            color: #fff;
            padding: 15px;
            resize: none;
            font-family: inherit;
            font-size: 0.8rem;
        }

        .box2 {
            display: block;
            margin: 0px auto;
            width: 100%;
            max-width: 100%;
            height: 40vh;
            min-height: 200px;
            margin-top: 20px;
            border-radius: 16px;
            border: 0.5px solid #fffbe4c4;
            box-shadow: 0px 0px 5px #F7E06D;
            background: transparent;
            color: #fff;
            padding: 15px;
            resize: none;
            font-family: inherit;
            font-size: 0.8rem;
        }

        .box2:focus {
            outline: none;
            border: 1px solid #F7E06D;
            box-shadow: 0px 0px 10px #F7E06D;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }
        .box:focus {
            outline: none;
            border: 1px solid #F7E06D;
            box-shadow: 0px 0px 10px #F7E06D;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }

        ::placeholder {
            font-size: 0.8rem;
        }

        .box1_save {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .btn1,
        .btn2 {
            width: 150px;
            height: 35px;
            font-size: 0.65rem;
            cursor: pointer;
            color: #fff;
            transition: 0.2s;
            margin: 0;
            padding: 0;
        }

        .btn1 {
            background: rgba(174, 255, 255, 0.34);
            border: 0.5px solid #AEFFFF;
            border-radius: 22px;
            box-shadow: 0px 0px 6px #AEFFFF;
            display: block;
            margin: 0px auto;
            margin-top: 70px;
        }

        .btn2 {
            background: rgba(255, 103, 35, 0.34);
            border: 0.5px solid #FF6723;
            border-radius: 22px;
            box-shadow: 0px 0px 6px #FF6723;
        }

        .btn1:hover {
            background: rgba(174, 255, 255, 0.5);

        }

        .btn2:hover {
            background: rgba(255, 103, 35, 0.5);
        }

        footer p {
            text-align: center;
            padding: 50px;
            padding-top: 100px;
            font-size: 0.6rem;
            font-weight: 100;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>

<body>
    <main>
        <header class="logo">
            <a href="list.html"><img src="img/Group 35.svg" alt="디스크"></a>
            <img src="img/Frame 9.svg" alt="로고">
            <div style="width: 24px;"></div>
        </header>
        <div class="layout">
            <div class="box1">
                <p>오늘 어떤 하루를 보냈나요?</p>
                <textarea class="box2" placeholder="오늘 하루를 담아보세요." id="diary-text"></textarea>
                <!-- <div class="box1_save">
                    <img class="icon" src="img/bottle.svg" alt="물병">
                    <input class="btn1" type="submit" value="소중히 보관하기">
                </div> -->
            </div>
            <div class="box1">
                <p>오늘 당신이 스스로에게 주고 싶은 칭찬은 무엇인가요?</p>
                <textarea class="box" placeholder="오늘의 잘한 일을 담아보세요." id="praise-text"></textarea>
                <!-- <div class="box1_save">
                    <img class="icon" src="img/bottle.svg" alt="물병">
                    <input class="btn1" type="submit" value="소중히 보관하기">
                </div> -->
            </div>
            <div class="box1">
                <p>오늘 이곳에 두고 갈 고민이 있나요?</p>
                <textarea class="box" placeholder="여기에 고민을 담아보세요." id="worry-text"></textarea>
                <!-- <div class="box1_save">
                    <img class="icon" src="img/fire.svg" alt="불꽃">
                    <input class="btn2" type="submit" value="미련없이 태우기">
                </div> -->
            </div>
            <input class="btn1" type="submit" value="마음을 소중히 기억하기">
        </div>
        <footer>
            <p>기억하고 싶은 오늘을 담다, 마음저장소</p>
        </footer>
    </main>
    <script>
       $(document).ready(function () {
    $('.btn1').click(function (e) {
        e.preventDefault();

        // 1. 데이터 가져오기 (각 textarea에 맞게 클래스/순서 확인)
        const diaryStr = $('.box2').val(); // 첫 번째 큰 박스
        const praiseStr = $('.box').eq(0).val(); // 두 번째 박스
        const worryStr = $('.box').eq(1).val(); // 세 번째 박스

        if (!diaryStr && !praiseStr && !worryStr) {
            alert("내용을 입력해주세요.");
            return;
        }

        let savedList = JSON.parse(localStorage.getItem('mindStorage')) || [];
        const now = new Date();
        const dateStr = now.toLocaleDateString();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // 2. 함수화하여 중복 방지
        function addData(type, text) {
            if (text.trim()) {
                savedList.unshift({
                    id: Date.now() + Math.random(), // 고유 ID 생성
                    type: type,
                    text: text,
                    date: dateStr,
                    time: timeStr
                });
            }
        }

        addData('diary', diaryStr);
        addData('praise', praiseStr);
        addData('worry', worryStr);

        // 3. 저장 및 초기화
        localStorage.setItem('mindStorage', JSON.stringify(savedList));
        alert("오늘의 마음이 모두 저장되었습니다.");
        $('textarea').val(''); 
    });
});
    </script>
</body>

</html>
