<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        @import url(https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css);

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #151531 0%, #000 100%);
            margin: 0;
            padding: 0;
        }

        body {
            color: #FFF;
            -webkit-text-stroke-width: 0.89px;
            -webkit-text-stroke-color: rgba(255, 241, 169, 0.15);
            font-family: "Bookk Myungjo";
            font-size: 0.9rem;
            font-style: normal;
            font-weight: 400;
            line-height: normal;
        }

        p,
        img,
        h1,
        h2,
        h3,
        ul,
        li,
        i {
            margin: 0;
            padding: 0;
        }

        ul,
        li {
            list-style: none;
        }

        main {
            overflow: hidden;
        }

        input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: "Bookk Myungjo";
        }

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            position: relative;
        }

        .logo a {
            position: absolute;
            top: 55px;
            left: 5%;
            right: auto;
            color: #ffffff;
            text-shadow: 0px 0px 3px #e7f9ff;
            font-size: 1.5rem;
            text-decoration: none;
            z-index: 10;
        }

        .logo img {
            max-width: 60%;
            height: auto;
            padding-top: 60px;
        }

        .layout {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 0 20px;
            margin-top: 50px;
        }

        .box1 {
            width: 100%;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 70px;
        }

        .box {
            display: block;
            margin: 0px auto;
            margin-top: 20px;
            width: 100%;
            max-width: 100%;
            height: 40vh;
            min-height: 200px;
            margin-top: 20px;
            border-radius: 16px;
            border: 0.5px solid #fffbe4c4;
            box-shadow: 0px 0px 5px #F7E06D;
            background: transparent;
            color: #fff;
            padding: 10px;
            resize: none;
            font-family: inherit;
            font-size: 0.8rem;
        }

        .box:focus {
            outline: none;
            border: 1px solid #F7E06D;
            box-shadow: 0px 0px 10px #F7E06D;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
        }

        ::placeholder {
            font-size: 0.8rem;
        }

        .box1_save {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .btn1,
        .btn2 {
            width: 96px;
            height: 29px;
            font-size: 0.6rem;
            cursor: pointer;
            color: #fff;
            transition: 0.2s;
            margin: 0;
            padding: 0;
        }

        .btn1 {
            background: rgba(174, 255, 255, 0.34);
            border: 0.5px solid #AEFFFF;
            border-radius: 22px;
            box-shadow: 0px 0px 6px #AEFFFF;
        }

        .btn2 {
            background: rgba(255, 103, 35, 0.34);
            border: 0.5px solid #FF6723;
            border-radius: 22px;
            box-shadow: 0px 0px 6px #FF6723;
        }

        .btn1:hover {
            background: rgba(174, 255, 255, 0.5);

        }

        .btn2:hover {
            background: rgba(255, 103, 35, 0.5);
        }

        footer p {
            text-align: center;
            padding: 60px;
            font-size: 0.5rem;
            font-weight: 100;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>

<body>
    <main>
        <header class="logo">
            <a href="list.html"><i class="fa-solid fa-cloud"></i></a>
            <img src="img/Frame 9.png" alt="로고">
        </header>
        <div class="layout">
            <div class="box1">
                <p>오늘 당신이 스스로에게 주고 싶은 칭찬은 무엇인가요?</p>
                <textarea class="box" placeholder="여기에 마음을 적어주세요."></textarea>
                <div class="box1_save">
                    <img class="icon" src="img/bottle.svg" alt="물병">
                    <input class="btn1" type="submit" value="소중히 보관하기">
                </div>
            </div>
            <div class="box1">
                <p>오늘 이곳에 두고 갈 고민이 있나요?</p>
                <textarea class="box" placeholder="여기에 마음을 적어주세요."></textarea>
                <div class="box1_save">
                    <img class="icon" src="img/fire.svg" alt="불꽃">
                    <input class="btn2" type="submit" value="미련없이 태우기">
                </div>
            </div>
        </div>
        <footer>
            <p>기억하고 싶은 오늘을 담다, 마음 저장소</p>
        </footer>
    </main>
    <script>
        $(document).ready(function () {
    // --- 1. 외부 클릭 시 키보드 내리기 ---
    $(document).on('click', function (e) {
        if (!$(e.target).is('textarea')) {
            $('textarea').blur();
        }
    });

    // --- 2. 데이터 저장 공통 함수 ---
    function saveMind(type, content) {
        if (!content.trim()) {
            alert("내용을 입력해주세요.");
            return;
        }

        // 저장할 객체 생성
        const mindData = {
            id: Date.now(),
            type: type, // 'praise' 또는 'worry'
            text: content,
            date: new Date().toLocaleDateString(), 
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        // 로컬스토리지에서 기존 목록 가져오기
        let savedList = JSON.parse(localStorage.getItem('mindStorage')) || [];
        
        // 새 데이터를 맨 앞에 추가
        savedList.unshift(mindData);
        
        // 다시 로컬스토리지에 저장
        localStorage.setItem('mindStorage', JSON.stringify(savedList));

        // 완료 알림 및 초기화
        alert(type === 'praise' ? "칭찬이 소중히 보관되었어요." : "고민이 미련없이 타올랐어요.");
    }

    // --- 3. 버튼 클릭 이벤트 연결 ---
    $('.btn1').click(function(e) {
        e.preventDefault();
        const $textarea = $(this).closest('.box1').find('textarea');
        saveMind('praise', $textarea.val());
        $textarea.val(''); // 입력창 비우기
    });

    $('.btn2').click(function(e) {
        e.preventDefault();
        const $textarea = $(this).closest('.box1').find('textarea');
        saveMind('worry', $textarea.val());
        $textarea.val(''); // 입력창 비우기
    });
});
    </script>
</body>

</html>
